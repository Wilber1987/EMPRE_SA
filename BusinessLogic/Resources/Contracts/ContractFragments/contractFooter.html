<table style='margin-top: 0px; margin-bottom: 0px;  width: 100%'>
    <tbody>
        <tr style='margin-top: 0px; margin-bottom: 0px;  width: 100%'>
            <td style='font-size: 9.5px; text-align: left;  width: 30%; border: none !important;'>
                <p
                    style='text-align:left; font-size:10px;width: 200px !important; margin-top:100px; border-top: solid 1px #000 !important; padding-bottom:0px; margin-bottom:0px; ; padding-top:10px'>
                    Deudor: {{ primer_nombre }} {{ segundo_nombre }} {{ primer_apellido }} {{ segundo_apellidio }}
                </p>
                <p style='text-align:left; font-size:10px; margin-top:0px; padding-bottom:0px; margin-bottom:0px;'>
                    Cédula:
                    {{ identificacion }}
                </p>
                <p style='text-align:left; font-size:10px; margin-top:0px; padding-bottom:0px; margin-bottom:0px;'>
                    Cel:{{ telefono }}
                </p>
            </td>
            <td style='font-size: 9.5px; text-align: right !important;  width: 70%; border: none !important'>
                <p style='text-align:right; font-size:10px; margin-top:0px; padding-bottom:0px; margin-bottom:0px;'>
                    <img style='height:80px; width:140px;' src='{{ firma }}' />
                </p>
                <p
                    style='text-align:right; font-size:10px; margin-top:0px; padding-bottom:0px; margin-bottom:0px; border-top: none !important; width: 100% !important; padding-top:10px'>
                    {{ datos_apoderado }}
                </p>
            </td>
        </tr>
    </tbody>
</table>
